name: 每日抓公開資料
on:
  schedule:
    - cron: '40 7 * * 1-5'   # 台北 15:40：當天收盤價
    - cron: '10 13 * * 1-5'  # 台北 21:10：上櫃、除權息資料補齊
  workflow_dispatch:
    inputs:
      budget:
        description: '這次最多跑幾分鐘'
        default: '40'
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓資料
        env:
          BUDGET_MIN: ${{ github.event.inputs.budget || '40' }}
        run: node scripts/fetch-data.mjs
      - name: 存回 repo
        run: |
          git config user.name 'stock-app data bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo '沒有變動'; exit 0; fi
          git commit -q -m "資料更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git pull -q --rebase origin main
          git push -q
