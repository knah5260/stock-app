name: 每日抓公開資料
on:
  schedule:
    - cron: '40 7 * * 1-5'   # 台北 15:40：當天收盤價
    - cron: '30 8 * * 1-5'   # 台北 16:30：備援（GitHub 排程常延遲或跳過）
    - cron: '30 9 * * 1-5'   # 台北 17:30：備援
    - cron: '0 11 * * 1-5'   # 台北 19:00：備援
    - cron: '10 13 * * 1-5'  # 台北 21:10：上櫃、除權息資料補齊
    - cron: '30 15 * * 1-5'  # 台北 23:30：備援（App 收盤後也會先用證交所的收盤成交價，不必等這裡）
  workflow_dispatch:
    inputs:
      budget:
        description: '這次最多跑幾分鐘'
        default: '40'
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓資料
        env:
          BUDGET_MIN: ${{ github.event.inputs.budget || '40' }}
        run: node scripts/fetch-data.mjs
      - name: 存回 repo
        run: |
          git config user.name 'stock-app data bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo '沒有變動'; exit 0; fi
          git commit -q -m "資料更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          # 跑的期間 repo 可能有新的提交：以這次抓到的資料為準重試幾次
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
